<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutri-Amigo | Alimentação e Hipertensão</title>
<link rel="stylesheet" href="style.css">
<meta name="description" content="Nutri-Amigo - Orientação nutricional para quem tem hipertensão">
</head>
<body>

<div class="telefone">

  <header class="barra-topo">
    <div class="avatar">🥗</div>
    <div class="contato">
      <h1>Nutri-Amigo</h1>
      <p id="status">online</p>
    </div>
  </header>

  <div class="conversa" id="mensagens">
    <div class="aviso">
      ⚠️ Este assistente dá dicas gerais de alimentação e não substitui a
      orientação do seu médico ou nutricionista.
    </div>
  </div>

  <div class="perguntas-rapidas" id="perguntas-rapidas"></div>

  <form id="form-chat">
    <input type="text" id="campo-mensagem" placeholder="Digite uma mensagem" autocomplete="off">
    <button type="submit" id="btn-enviar" aria-label="Enviar mensagem">➤</button>
  </form>

</div>

<script src="script.js"></script>
</body>
</html>
